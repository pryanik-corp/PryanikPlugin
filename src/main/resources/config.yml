database:
  url: jdbc:postgresql://localhost:5432/DATABASE?sslmode=disable
  user: postgres
  password: "SET_YOUR_POSTGRES_PASSWORD_HERE"
  pool-size: 10
admin-worlds:
  # Defaults for worlds not customized in /ppadmin.
  defaults:
    block-place: true
    block-break: true
    interact: true
  lobby:
    spawn:
      x: 4.449
      y: -58.0
      z: 21.489
      yaw: 0.0
      pitch: 0.0
admin-api:
  enabled: false
  bind: 0.0.0.0
  port: 8765
  token: "SET_A_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"
  allowed-clients:
    - "192.168.100.10" # IIS website host LAN address
game-modes:
  survival:
    enabled: true
    instances: 20
    capacity: 20
  hardcore:
    enabled: true
    instances: 5
    capacity: 15
  anarchy:
    enabled: true
    instances: 15
    capacity: 15
